server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # I file di dati devono restare leggibili e scaricabili: sono meta' del
    # senso del progetto.
    charset utf-8;
    charset_types text/css application/javascript text/csv application/json image/svg+xml;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/csv application/json
               application/javascript image/svg+xml;

    # Gli asset hanno nomi stabili e contenuto congelato dallo snapshot,
    # quindi si possono tenere in cache a lungo. L'HTML no: se si corregge
    # un refuso deve arrivare subito.
    location /assets/ { expires 30d; add_header Cache-Control "public"; }
    location /dati/   { expires 30d; add_header Cache-Control "public"; }
    location = /index.html  { expires -1; }
    location = /metodo.html { expires -1; }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
}
